# GitHub Actions = public smoke test + green badge. Cheap, repo-wide checks
# that need no LAN access.
#
# Deeper checks live in .gitlab-ci.yml on the self-hosted runner:
#   ansible-lint (production profile) · terraform validate · tflint
# Keep the two COMPLEMENTARY, not duplicated.
name: validate
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      # Formatting only — correctness is `terraform validate` in GitLab CI.
      - name: terraform fmt
        run: |
          cd terraform && terraform fmt -check -recursive

      # Repo-wide YAML. GitLab's ansible-lint only covers ansible/, so this
      # catches compose/, kubernetes/, .gitlab-ci.yml and these workflows.
      # Shares .yamllint with ansible-lint so the two configs can't drift.
      - name: yaml lint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint

      # Not checked anywhere else.
      - name: shellcheck
        run: sudo apt-get install -y shellcheck && shellcheck scripts/*.sh terraform/aws-demo/scripts/*.sh