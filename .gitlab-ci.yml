stages:
  - lint
  - security

ansible-lint:
  stage: lint
  image: python:3.12-slim
  tags:
    - docker
  before_script:
    - pip install --no-cache-dir ansible-lint
    - ansible-galaxy collection install -r ansible/requirements.yml
  script:
    - ansible-lint ansible/

terraform-validate:
  stage: lint
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]        # image ENTRYPOINT is `terraform`; blank it so GitLab gets a shell
  tags:
    - docker
  script:
    - terraform -chdir=terraform/proxmox init -backend=false -input=false
    - terraform -chdir=terraform/proxmox validate
    - terraform -chdir=terraform/aws-demo init -backend=false -input=false
    - terraform -chdir=terraform/aws-demo validate


tflint:
  stage: lint
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  tags:
    - docker
  script:
    - tflint --chdir=terraform/proxmox
    - tflint --chdir=terraform/aws-demo


trivy-terraform:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]        # ENTRYPOINT is `trivy`; blank it so GitLab gets a shell
  tags:
    - docker
  script:
    - trivy config --exit-code 1 terraform/

trivy-kubernetes:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags:
    - docker
  allow_failure: true       # visible, not blocking — until the securityContext work lands
  script:
    - trivy config --exit-code 1 kubernetes/
  
