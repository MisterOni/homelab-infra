---
# Deploy Docker compose stacks from git, per host. Secrets via Ansible Vault.
#   ansible-playbook deploy-stacks.yml --ask-vault-pass
# Per-stack tags let you deploy one thing without re-pulling everything, e.g.
#   ansible-playbook deploy-stacks.yml --tags "monitoring,promtail" --ask-vault-pass
- name: Family stacks (Nextcloud, Immich)
  hosts: family-vm
  tags: [family]
  roles:
    - role: compose_stack
      vars:
        stack_name: family

- name: Media automation stack
  hosts: media-vm
  tags: [media]
  roles:
    - role: compose_stack
      vars:
        stack_name: media

- name: Monitoring — Prometheus + Grafana + uptime-kuma + Loki (core-infra on g11)
  hosts: monitor-vm
  tags: [monitoring]
  roles:
    - role: compose_stack   # stack_name + stack_env come from host_vars/monitor-vm.yml

- name: DNS — AdGuard Home (LAN resolver + ad-blocking, on monitor-vm)
  hosts: monitor-vm
  tags: [dns]
  roles:
    - role: compose_stack
      vars:
        stack_name: dns
        stack_env: {}         # no secrets; empty so it doesn't inherit monitoring's stack_env

- name: Reverse proxy — Nginx Proxy Manager (*.lab hostnames, on monitor-vm)
  hosts: monitor-vm
  tags: [proxy]
  roles:
    - role: compose_stack
      vars:
        stack_name: proxy
        stack_env: {}

- name: Log shipping — Promtail on every Docker host → Loki
  hosts: docker_hosts
  tags: [promtail]
  roles:
    - role: compose_stack
      vars:
        stack_name: promtail
        stack_env:
          PROMTAIL_HOST: "{{ inventory_hostname }}"    # per-host label
          LOKI_URL: "http://192.168.0.31:3100/loki/api/v1/push"

- name: GitLab CE (git + CI/CD + registry, on gitlab-vm / g11)
  hosts: gitlab-vm
  tags: [gitlab]
  roles:
    - role: compose_stack   # stack_name + stack_env from host_vars/gitlab-vm.yml

- name: Notes backend — CouchDB for Obsidian LiveSync (family tier → PBS-backed)
  hosts: family-vm
  tags: [notes]
  roles:
    - role: compose_stack
      vars:
        stack_name: notes
        # family-vm host_vars filters to [nextcloud, nextcloud-db]; override so
        # this deploy targets couchdb, not that filter.
        stack_services: [couchdb]
        stack_env:
          COUCHDB_USER: "{{ vault_couchdb_user | default('obsidian') }}"
          COUCHDB_PASSWORD: "{{ vault_couchdb_password }}"
