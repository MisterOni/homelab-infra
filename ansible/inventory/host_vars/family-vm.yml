# Family stack config (Immich + Nextcloud). Secrets in vault.
stack_dir: /home/ubuntu/stacks
stack_env:
  # Immich photo library on the SSD-backed `data` ZFS pool (mounted at /mnt/immich in the VM).
  UPLOAD_LOCATION: /mnt/immich
  DB_HOSTNAME: immich-db          # must match the compose service name
  REDIS_HOSTNAME: immich-redis    # must match the compose service name
  DB_PASSWORD: "{{ vault_immich_db_password }}"
  DB_USERNAME: immich
  DB_DATABASE_NAME: immich
  NC_DB_PASSWORD: "{{ vault_nextcloud_db_password }}"
