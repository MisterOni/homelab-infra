# monitor-vm (g11) — core-infra. Runs the monitoring stack only.
# (Obsidian's CouchDB lives on family-vm so it rides the K8 Plus PBS backups.)
stack_dir: /home/ubuntu/stacks
stack_name: monitoring
stack_env:
  GRAFANA_ADMIN_PASSWORD: "{{ vault_grafana_admin_password }}"
  # Alert email (SMTP) via Proton Business SMTP submission. Host/user/from are not
  # secret; the password is the Proton SMTP token in vault (vault_smtp_password).
  # Token is generated in Proton → Settings → IMAP/SMTP → SMTP submission.
  SMTP_HOST: "smtp.protonmail.ch:587"
  SMTP_USER: "misteroni@jchoo.me"
  SMTP_FROM: "misteroni@jchoo.me"
  SMTP_PASSWORD: "{{ vault_smtp_password }}"
