---
- name: Download the K3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_installer_url }}"
    dest: "{{ k3s_installer_path }}"
    mode: "0755"

# Setting K3S_URL is what makes the installer choose AGENT mode instead of
# starting another server.
- name: Install the K3s agent and join the cluster
  ansible.builtin.command: "{{ k3s_installer_path }}"
  args:
    creates: /usr/local/bin/k3s
  environment:
    K3S_URL: "https://{{ hostvars[k3s_server_host].ansible_host }}:6443"
    K3S_TOKEN: "{{ hostvars[k3s_server_host].k3s_node_token }}"
  changed_when: true
  no_log: true
