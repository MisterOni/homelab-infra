---
- name: Install Tailscale
  ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
  args: { creates: /usr/bin/tailscale }

# Servers (nodes AND VMs) get their OWN tailnet identity for direct remote access,
# but must be IDENTITY-ONLY: never let Tailscale manage routes or DNS.
#   --accept-routes on a machine that lives on the advertised /24 reroutes its own
#     LAN + corosync through the tunnel → it locks itself out.
#   --accept-dns (MagicDNS) hijacks the resolver → if the upstream hiccups, public
#     name resolution dies (breaks every container that needs DNS).
# Both learned the hard way — see JOURNAL gotchas. Only client devices accept these.
# Guard on Tailscale's OWN backend state, NOT the state file: tailscaled writes
# /var/lib/tailscale/tailscaled.state the moment the daemon starts — before any
# login — so a `creates:` guard on it skips the join and leaves the node NeedsLogin.
- name: Check Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false

- name: Join tailnet (own identity, Tailscale SSH, no route/DNS management)
  ansible.builtin.command: >
    tailscale up
    --authkey={{ lookup('env', 'TS_AUTHKEY') }}
    --ssh
    --accept-routes=false
    --accept-dns=false
  when: ts_status.rc != 0 or '"NeedsLogin" in ts_status.stdout' or '"Stopped" in ts_status.stdout'

# Enforce the policy on every run so a manual `tailscale up ...` can't silently
# re-enable route/DNS acceptance. Idempotent.
- name: Enforce identity-only Tailscale (no route/DNS acceptance)
  ansible.builtin.command: tailscale set --accept-routes=false --accept-dns=false
  changed_when: false
