---
# One playbook, three identical nodes. Re-running it on a fresh node
# is the whole point: second run should take ten minutes, not a weekend.
- name: Proxmox node baseline
  hosts: proxmox_nodes
  roles:
    # role-level tags so we can apply pieces safely, e.g.
    #   ansible-playbook site.yml --limit proxmox_nodes --tags "disk_health,tailscale"
    # (skips the firewall role, which can lock out LAN SSH if applied carelessly).
    - { role: proxmox_postinstall, tags: [postinstall] }
    - { role: common,              tags: [common] }
    - { role: nic_tuning,          tags: [nic_tuning] }             # disable EEE on igc NICs (flap fix)
    - { role: node_exporter,       tags: [node_exporter] }
    - { role: disk_health,         tags: [disk_health, metrics] }   # ZFS + SMART → Prometheus
    - { role: tailscale,           tags: [tailscale] }
    - { role: proxmox_firewall,    tags: [firewall] }               # cluster.fw — see ADR-003/005

# Network layout (ADR-005). Run this play deliberately, one node at a time,
# with a console/KVM handy — a bad /etc/network/interfaces locks you out.
#   ansible-playbook site.yml --tags network --limit k8plus
- name: Proxmox dual-NIC network (ADR-005)
  hosts: proxmox_nodes
  tags: [network]
  roles:
    - proxmox_network

- name: Docker hosts baseline
  hosts: docker_hosts
  roles:
    - { role: common,        tags: [common] }
    - { role: docker,        tags: [docker] }
    - { role: node_exporter, tags: [node_exporter] }
    # Identity-only Tailscale on the VMs too (direct remote access, no route/DNS mgmt).
    # Joining a NOT-yet-enrolled VM needs TS_AUTHKEY in the env; already-joined VMs just
    # get the accept-routes/dns=false enforcement.
    - { role: tailscale,     tags: [tailscale] }

- name: Media-vm extras — qBittorrent/gluetun self-heal watchdog
  hosts: media-vm
  tags: [qbit_watchdog]
  roles:
    - qbittorrent_watchdog

- name: MacBook lab-node extras — NIC self-heal + panel blank (ADR-002)
  hosts: lab
  tags: [lab]
  roles:
    - nic_watchdog
    - console_blank

- name: LXC baseline (Jellyfin + cloudflared containers)
  hosts: lxc_hosts
  roles:
    - { role: common,        tags: [common] }
    - { role: node_exporter, tags: [node_exporter] }
