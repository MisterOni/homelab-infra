# Tiny demo app — the payload for both the homelab K3s cluster AND the AWS demo.
# CI bumps the image tag here; ArgoCD does the rest. That's the whole pipeline.
apiVersion: apps/v1
kind: Deployment
metadata: { name: demo-app, labels: { app: demo-app } }
spec:
  replicas: 3
  selector: { matchLabels: { app: demo-app } }
  template:
    metadata: { labels: { app: demo-app } }
    spec:
      containers:
        - name: web
          image: traefik/whoami:v1.10 # replace with your own app image from the GitLab registry
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata: { name: demo-app }
spec:
  # ClusterIP is enough: Traefik runs INSIDE the cluster, so it can reach this
  # directly. Only Traefik needs to be externally reachable — and it already is.
  type: ClusterIP
  selector: { app: demo-app }
  ports: [{ port: 80, targetPort: 80 }]

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
spec:
  ingressClassName: traefik
  rules:
    - host: demo.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app
                port:
                  number: 80
